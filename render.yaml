services:
  - type: web
    name: wastewatch
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: WasteWatch <onboarding@resend.dev>
      - key: GROQ_API_KEY
        sync: false
      - key: FAST2SMS_KEY
        sync: false
      - key: DATABASE_MODE
        value: sqlite
      # Uncomment below for Supabase production:
      # - key: DATABASE_MODE
      #   value: supabase
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_KEY
      #   sync: false
      # - key: SUPABASE_DB_URL
      #   sync: false
